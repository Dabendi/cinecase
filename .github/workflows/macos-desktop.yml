            "ffprobe": "ffprobe",
            "roots": [
              { "label": "Test", "path": "$TMP/media", "min_size_mb": 0 }
            ]
          }
          EOF
          CINE_HOME="$TMP" "$APP" --scanner --watch >/dev/null 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if [ -f "$TMP/data/status.json" ] && \
               grep -q '"phase": "idle"' "$TMP/data/status.json" && \
               grep -q '"last_scan_at"' "$TMP/data/status.json"; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          python3 - "$TMP" <<'PY'
          import os, sqlite3, sys
          tmp = sys.argv[1]
          db = os.path.join(tmp, "data", "library.db")
